<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福强企业服务咨询报价单 - 重设计版</title>
    <style>
        /* ================= 基础重置与变量 ================= */
        :root {
            --brand-blue: #4A72E8;      /* 提取自 Logo 的品牌蓝 */
            --text-main: #1A1A1A;       /* 主标题及强调文本 */
            --text-regular: #444444;    /* 常规正文 */
            --text-light: #777777;      /* 补充说明文本 */
            --border-color: #EAEAEA;    /* 极浅灰实线分割 */
            --bg-color: #F7F9FC;        /* 页面背景 */
            --bg-card: #FFFFFF;         /* 报价单背景 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--text-regular);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 页面主体容器 ================= */
        .quote-container {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 960px;
            padding: 80px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            position: relative;
        }

        /* ================= 头部：标题与二维码 ================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 70px;
            position: relative;
        }

        .header-left-spacer {
            width: 100px; /* 用于平衡右侧二维码宽度，保证标题绝对居中 */
        }

        .main-title {
            font-size: 2.6rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 2px;
            text-align: center;
            flex-grow: 1;
            padding-top: 10px;
        }

        .main-title .highlight {
            color: var(--brand-blue);
        }

        /* 右上角二维码区块 */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
        }

        .qr-box {
            width: 80px;
            height: 80px;
            background-color: #F0F4FF;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .qr-text {
            font-size: 0.75rem;
            color: var(--text-light);
            text-align: center;
            letter-spacing: 1px;
        }

        /* ================= 报价列表网格 ================= */
        .quote-list {
            display: flex;
            flex-direction: column;
        }

        .quote-item {
            display: grid;
            grid-template-columns: 2fr 3fr; /* 左侧标题占2份，右侧内容占3份 */
            gap: 50px;
            padding: 45px 0;
            border-bottom: 1px solid var(--border-color); /* 改进：实线浅灰分割 */
            align-items: flex-start;
        }

        .quote-item:last-child {
            border-bottom: none;
            padding-bottom: 20px;
        }

        /* 左侧项目名称 */
        .item-name {
            text-align: right;          /* 改进：靠右对齐，形成垂直中轴线 */
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            padding-top: 5px;
            letter-spacing: 1px;
        }

        /* 右侧价格详情 */
        .item-details {
            text-align: left;           /* 改进：强制左对齐 */
        }

        .price-line {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .price-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            display: inline-block;
            width: 110px;               /* 改进：固定数字宽度，让单位完全对齐 */
        }

        .price-unit {
            color: var(--text-regular);
        }

        .sub-desc {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-top: 8px;
        }

        /* 培训价格专属模块 */
        .training-module {
            margin-top: 20px;
            background-color: #F8FAFF;  /* 增加品牌底色块，提升高级感 */
            padding: 24px;
            border-radius: 8px;
            border-left: 4px solid var(--brand-blue);
        }

        .training-title {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            font-size: 1.05rem;
        }

        .training-grid {
            display: grid;
            grid-template-columns: 80px 1fr; /* 改进：表格化排版，冒号完美对齐 */
            gap: 12px;
            font-size: 1rem;
            align-items: center;
        }

        .training-label {
            color: var(--text-regular);
        }

        .training-val {
            font-weight: 500;
            color: var(--text-main);
        }

        .min-unit {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--brand-blue);
            font-weight: 500;
        }

        /* ================= 底部说明与 Logo ================= */
        /* 改进：将右上角杂乱的注释放到底部集中展示 */
        .footer-notes {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.8;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .footer-notes span::before {
            content: "•";
            margin-right: 6px;
            color: var(--brand-blue);
        }

        .footer-logo {
            text-align: center;
            margin-top: 60px;
        }

        .logo-main {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--brand-blue);
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .logo-sub {
            font-size: 1.1rem;
            color: #888888;
            letter-spacing: 1.5px;
            font-weight: 300;
            text-transform: uppercase;
        }
    </style>
</head>
